# Profile `smoke` chỉ dùng cho smoke test Spring Boot - KHÔNG cần MySQL.
# Phù hợp với môi trường developer không có Docker (AGENTS.md §3.1: test runtime
# thật vẫn phải chạy trong Docker Compose).
spring:
  datasource:
    url: jdbc:h2:mem:smoke;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: false
